id: nginx-502
version: 1
title: Nginx answers 502
summary: The site behind nginx is down. Bring it back without reinstalling anything.
description: description.md
difficulty: easy
tags: [nginx, systemd]
image: debian-12
resources:
  cpus: 1
  memory_mib: 1024
  disk_gib: 8
timeouts:
  bootstrap_seconds: 900
  check_seconds: 30
  session_minutes: 30
trainee:
  user: trainee
  sudo: true
packages: [nginx, python3, curl]
steps:
  install: install.sh
  configure: configure.sh
  break: break.sh
check: check.sh
hints:
  - Look at what nginx proxies to.
  - Which unit should be listening on that port?
