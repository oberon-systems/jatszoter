name: agent

on:
  pull_request:
    paths:
      - packages/agent/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/agent.yml
  push:
    tags:
      - agent-*

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # Installs passt and its passt-local AppArmor profile as docs/project/09-guest-network.md
      # does; TMPDIR sits in a directory the profile lets passt write.
      - name: Guest network
        env:
          PASST_TAG: 2026_10_02.cba3570
          PASST_COMMIT: cba357068dc586e7540971eb40bb56c5e62c4de1
        run: |
          src=$RUNNER_TEMP/passt
          git clone --quiet --depth 1 --branch "$PASST_TAG" https://passt.top/passt "$src"
          test "$(git -C "$src" rev-parse HEAD)" = "$PASST_COMMIT"
          make -C "$src"
          sudo install -m 0755 "$src/passt" "$src/passt.avx2" /usr/local/bin/
          sed 's#/usr/bin/passt.avx2#/usr/local/bin/passt.avx2#' \
              "$src/contrib/apparmor/abstractions/passt" |
              sudo tee /etc/apparmor.d/abstractions/jatszoter-passt >/dev/null
          sed -e 's#^profile passt /usr/bin/passt{,.avx2}#profile passt-local /usr/local/bin/passt{,.avx2}#' \
              -e 's#include <abstractions/passt>#include <abstractions/jatszoter-passt>#' \
              -e 's#^\( *\)/usr/bin/passt r,#\1/usr/local/bin/passt r,#' \
              -e 's#^}#  owner @{HOME}/.cache/jatszoter/** rw,\n  owner /var/lib/jatszoter-agent/** rw,\n}#' \
              "$src/contrib/apparmor/usr.bin.passt" |
              sudo tee /etc/apparmor.d/usr.local.bin.passt >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/usr.local.bin.passt
          sudo grep -q passt-local /sys/kernel/security/apparmor/profiles
          mkdir -p "$HOME/.cache/jatszoter/tmp"
          TMPDIR=$HOME/.cache/jatszoter/tmp cargo test --workspace --locked netcheck -- --ignored

  version:
    if: startsWith(github.ref, 'refs/tags/agent-')
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main or a stable branch
        run: |
          git branch -r --contains "$GITHUB_SHA" | sed 's/^ *//' |
            grep -Eqx 'origin/(main|[0-9]+\.x\.x-stable)'
      - name: Check the tag against Cargo.toml
        id: check
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' packages/agent/Cargo.toml)"
          test "$GITHUB_REF_NAME" = "agent-$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: stable
      - name: Build
        run: cargo build --release --locked -p jatszoter-agent
      - name: Checksums
        run: |
          mkdir dist
          cp target/release/jatszoter-agent "dist/jatszoter-agent-$VERSION-x86_64-linux-gnu"
          cd dist && sha256sum jatszoter-agent-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$(awk -v head="## $GITHUB_REF_NAME " \
            'index($0, head) == 1 { keep = 1; next } /^## / { keep = 0 } keep' \
            packages/agent/CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" \
            "dist/jatszoter-agent-$VERSION-x86_64-linux-gnu" dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --latest=false \
            --notes "${notes:-Jatszoter agent $VERSION on crates.io.}"

  crates-io:
    needs: [version, release]
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p jatszoter-agent
