id: nginx-502
version: 3
title: Nginx answers 502
summary: The site behind nginx is down. Bring it back without reinstalling anything.
description: description.md
difficulty: easy
tags: [nginx, systemd]
image: rocky-9
resources:
  cpus: 1
  memory_mib: 1024
  disk_gib: 12
timeouts:
  bootstrap_seconds: 1800
  check_seconds: 30
  session_minutes: 30
trainee:
  user: trainee
  sudo: true
packages: [nginx, python3]
steps:
  install: install.sh
  configure: configure.sh
  break: break.sh
check: check.sh
outside:
  network:
    - port: 80
      http:
        contains: hello from app
  disk:
    - path: /etc/nginx/conf.d/app.conf
      contains: proxy_pass http://127.0.0.1:8081;
hints:
  - Look at what nginx proxies to.
  - Which unit should be listening on that port?
