events {}

http {
    ssl_certificate /etc/nginx/tls/mock.crt;
    ssl_certificate_key /etc/nginx/tls/mock.key;

    server {
        listen 443 ssl;
        server_name github.com;

        location = /oberon-systems/jatszoter/releases/latest {
            return 302 https://github.com/oberon-systems/jatszoter/releases/tag/1.0.0;
        }

        location ~ ^/oberon-systems/jatszoter/releases/latest/download/(.+)$ {
            return 302 https://github.com/oberon-systems/jatszoter/releases/download/1.0.0/$1;
        }

        location /oberon-systems/jatszoter/releases/tag/ {
            default_type text/plain;
            return 200 "jatszoter mock release\n";
        }

        location /oberon-systems/jatszoter/releases/download/ {
            root /usr/share/nginx/www;
            default_type application/octet-stream;
        }
    }

    server {
        listen 443 ssl;
        server_name ghcr.io;
        client_max_body_size 0;

        location /v2/ {
            proxy_pass http://registry:5000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
