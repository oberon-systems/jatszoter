<dialog class="dialog" aria-labelledby="dialog-title">
    <h2 class="heading" id="dialog-title">Link for {{ name }}</h2>
    <p class="dialog-text">
        Hand it to {{ name }}. It is shown once and cannot be shown again; a lost link is revoked and issued anew.
    </p>
    <div class="link-row">
        <label class="field grow">
            <span class="label">Link</span>
            <input class="input mono-small"
                   id="issued-link"
                   type="text"
                   value="{{ link }}"
                   readonly>
        </label>
        <button class="button button-secondary" type="button" data-copy="issued-link">Copy</button>
    </div>
    <div class="dialog-actions">
        <button class="button button-primary" type="button" data-close autofocus>Done</button>
    </div>
</dialog>
