{% from "flash.html" import flash %}
{% from "ui.html" import field_error, invalid, password_hint with context %}
<dialog class="dialog" aria-labelledby="dialog-title">
    <h2 class="heading" id="dialog-title">One-time password for {{ name }}</h2>
    <p class="dialog-text">{{ name }} logs in with it once and must then choose a new password.</p>
    {% for item in flashes %}{{ flash(item) }}{% endfor %}
    <form class="dialog-form"
          method="post"
          action="{{ url_for('set_password', user_id=id).path }}"
          hx-post="{{ url_for('set_password', user_id=id).path }}"
          hx-target="closest dialog"
          hx-swap="outerHTML">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label class="field">
            <span class="label">Password</span>
            <input class="input{{ invalid(errors, 'password') }}"
                   type="password"
                   name="password"
                   autocomplete="new-password"
                   minlength="{{ password_length }}"
                   data-password="{{ password_rule }}"
                   required
                   autofocus>
            {{ password_hint(errors, "password") }}
        </label>
        <label class="field">
            <span class="label">Repeat password</span>
            <input class="input{{ invalid(errors, 'repeat_password') }}"
                   type="password"
                   name="repeat_password"
                   autocomplete="new-password"
                   data-repeat="password"
                   data-differ="{{ passwords_differ }}"
                   required>
            {{ field_error(errors, "repeat_password") }}
        </label>
        <div class="dialog-actions">
            <button class="button button-secondary" type="button" data-close>Cancel</button>
            <button class="button button-primary" type="submit">Set password</button>
        </div>
    </form>
</dialog>
