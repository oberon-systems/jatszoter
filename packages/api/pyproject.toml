[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jatszoter-api"
version = "0.1.0"
description = "Control plane for jatszoter: agents, scenarios, deployments, links and recordings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "alembic",
  "fakeredis",
  "fastapi",
  "httpx",
  "jsonschema",
  "pydantic-settings",
  "python-multipart",
  "python-statemachine",
  "pyyaml",
  "sqlmodel",
  "valkey",
]

[project.optional-dependencies]
# What serves the app in a container; the library itself needs neither.
server = ["uvicorn[standard]"]

[tool.setuptools.package-data]
jatszoter_api = [
  "py.typed",
  "migrations/*.py",
  "migrations/*.mako",
  "migrations/versions/*.py",
  "schemas/*.yaml",
  "guest/*",
]
