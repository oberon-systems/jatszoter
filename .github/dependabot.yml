# Weekly update pull requests for everything the repository pins: Python
# requirements, pre-commit hooks, the agent's crates, the base images, the
# vendored browser packages and the GitHub Actions. Minor and patch updates of
# one ecosystem come as a single pull request.
version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "[build][pip]"
    groups:
      pip:
        update-types: [minor, patch]
    # wyld-cz requires commitizen <5; the hook rev and wyld-cz move with it by hand.
    ignore:
      - dependency-name: commitizen
        update-types: [version-update:semver-major]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "[build][pre-commit]"
    groups:
      pre-commit:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*commitizen*"
        update-types: [version-update:semver-major]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "[build][cargo]"
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /docker/api
      - /docker/web
    schedule:
      interval: weekly
    commit-message:
      prefix: "[build][docker]"
    groups:
      docker:
        update-types: [minor, patch]

  # web.yml copies an update into static/vendor and commits it to the pull request.
  - package-ecosystem: npm
    directory: /packages/web/vendor
    schedule:
      interval: weekly
    commit-message:
      prefix: "[build][npm]"
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "[build][github-actions]"
    groups:
      github-actions:
        update-types: [minor, patch]
