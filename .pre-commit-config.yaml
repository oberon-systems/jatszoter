# The commit-msg hooks below only ever run once git has a commit-msg hook
# script, which `pre-commit install` writes only when asked for that type.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
        files: .*\.(yaml|yml)$
        # MkDocs reads its URLs through the !ENV tag, which a plain YAML loader refuses.
        exclude: ^docs/mkdocs\.yml$
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: forbid-crlf
      - id: remove-crlf
      - id: forbid-tabs
        files: \.(py|rs|sh|md|ya?ml|toml|json|html)$
      - id: remove-tabs
        args: [--whitespaces-count, '2']
        files: \.(py|rs|sh|md|ya?ml|toml|json|html)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies:
          - alembic==1.20.0
          - cryptography==50.0.2
          - fakeredis==2.40.0
          - fastapi==0.143.3
          - httpx==0.28.1
          - httpx-ws==0.9.0
          - Jinja2==3.1.6
          - jsonschema==4.26.0
          - mkdocs==1.6.1
          - pydantic==2.14.1
          - pydantic-settings==2.16.0
          - pytest==9.1.1
          - python-statemachine==3.2.2
          - sqlmodel==0.0.48
          - types-jsonschema==4.26.0.20260518
          - types-PyYAML==6.0.12.20260906
          - valkey==6.2.0
          - websockets==17.2

  - repo: https://github.com/djlint/djLint
    rev: v1.46.1
    hooks:
      # The hooks ship types_or: [jinja], a tag identify never puts on a
      # .html file, so without this override both silently match nothing.
      - id: djlint-reformat-jinja
        types_or: [html, jinja]
        files: ^packages/web/.*\.html$
      - id: djlint-jinja
        types_or: [html, jinja]
        files: ^packages/web/.*\.html$

  # hadolint is a single binary and comes from the host, like cargo in the
  # local hooks below; install it once and `make lint` picks it up.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
      # The stock hook reads only the index, so `make lint` never shows it a new file.
      - id: gitleaks
        alias: gitleaks-files
        name: Detect hardcoded secrets in the files given
        entry: bash -c 'for f; do gitleaks dir --redact --no-banner "$f" || exit 1; done' --
        pass_filenames: true

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-jsonschema
        name: scenario schema
        files: ^scenarios/[^/]+/scenario\.yaml$
        args: [--schemafile, packages/api/src/jatszoter_api/schemas/scenario.schema.yaml]
      - id: check-metaschema
        files: ^packages/api/src/jatszoter_api/schemas/.*\.schema\.yaml$

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint

  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: forbid-binary
        # Vendored web fonts, each beside its licence. A type, not a path: the
        # path exclude trips check-useless-excludes while the fonts are untracked.
        exclude_types: [woff2]
      - id: require-ascii
      - id: shellcheck
        args: [-e, SC2086]
      # -i 4 overrides shfmt's tab indentation, which the forbid-tabs hook
      # above rejects in *.sh. Without it the two hooks fight over every edit.
      - id: shfmt
        args: [-w, -i, '4']

  # `cz check` validates the message against the provider's schema_pattern(),
  # so the hook environment needs the provider itself. Keep this rev, the pins
  # in requirements.txt and the provider release in step.
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.2
    hooks:
      - id: commitizen
        additional_dependencies: [wyld-cz==0.4.1]
      - id: commitizen-branch
        additional_dependencies: [wyld-cz==0.4.1]
        stages: [pre-push]

  - repo: meta
    hooks:
      - id: check-useless-excludes
