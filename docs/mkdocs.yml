# docs/project rendered with the readthedocs theme, restyled; .github/workflows/docs.yml
# publishes it to GitHub Pages and passes the two URLs below.
site_name: Jatszoter
site_url: !ENV [SITE_URL, ""]
repo_url: !ENV [REPO_URL, ""]
edit_uri: blob/main/docs/project/

docs_dir: project
site_dir: ../site
strict: true

# No nav: pages are listed in file name order, so they are numbered.
theme:
  name: readthedocs
  custom_dir: .theme
  collapse_navigation: false
  navigation_depth: 2
  highlightjs: false

extra_css:
  - assets/fonts.css
  - assets/site.css

extra_javascript:
  - assets/site.js

hooks:
  - .theme/hooks.py
