[package]
name = "jatszoter-agent"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
description = "Host daemon for jatszoter: leases deployments and runs them in QEMU VMs"

[dependencies]
base64 = "0.22"
dotenvy = "0.15.7"
envy = "0.4.2"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
hex = "0.4"
hmac = "0.12"
nix = { version = "0.31", features = ["process", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url = "2"

[dev-dependencies]
wiremock = "0.6"

[lints]
workspace = true
