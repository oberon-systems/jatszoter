name: checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-all:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.15'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - name: Install
        run: make install
      - name: Lint
        run: make lint-all

  test-all:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.15'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - name: Install
        run: make install
      - name: Test
        run: make test

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.15'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf xorriso jq
          make install
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The same passt and passt-local AppArmor profile as agent.yml installs.
      - name: Guest network
        env:
          PASST_TAG: 2026_10_02.cba3570
          PASST_COMMIT: cba357068dc586e7540971eb40bb56c5e62c4de1
        run: |
          src=$RUNNER_TEMP/passt
          git clone --quiet --depth 1 --branch "$PASST_TAG" https://passt.top/passt "$src"
          test "$(git -C "$src" rev-parse HEAD)" = "$PASST_COMMIT"
          make -C "$src"
          sudo install -m 0755 "$src/passt" "$src/passt.avx2" /usr/local/bin/
          sed 's#/usr/bin/passt.avx2#/usr/local/bin/passt.avx2#' \
              "$src/contrib/apparmor/abstractions/passt" |
              sudo tee /etc/apparmor.d/abstractions/jatszoter-passt >/dev/null
          sed -e 's#^profile passt /usr/bin/passt{,.avx2}#profile passt-local /usr/local/bin/passt{,.avx2}#' \
              -e 's#include <abstractions/passt>#include <abstractions/jatszoter-passt>#' \
              -e 's#^\( *\)/usr/bin/passt r,#\1/usr/local/bin/passt r,#' \
              -e 's#^}#  owner @{HOME}/.cache/jatszoter/** rw,\n  owner /var/lib/jatszoter-agent/** rw,\n}#' \
              "$src/contrib/apparmor/usr.bin.passt" |
              sudo tee /etc/apparmor.d/usr.local.bin.passt >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/usr.local.bin.passt
          sudo grep -q passt-local /sys/kernel/security/apparmor/profiles
      # The smoke working dir comes from TMPDIR and must sit where the profile lets passt write.
      - name: Smoke
        run: |
          mkdir -p "$HOME/.cache/jatszoter/tmp"
          TMPDIR=$HOME/.cache/jatszoter/tmp make smoke
