[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jatszoter-api"
version = "0.1.0"
description = "Control plane for jatszoter: agents, scenarios, deployments, links and recordings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.0",
  "fakeredis>=2.40.0",
  "fastapi>=0.149.0",
  "httpx>=0.28.1",
  "jsonschema>=4.26.0",
  "pydantic-settings>=2.16.0",
  "python-multipart>=0.0.32",
  "python-statemachine>=3.2.2",
  "pyyaml>=6.0.3",
  "sqlmodel>=0.0.48",
  "valkey>=6.2.0",
]

[project.optional-dependencies]
# What serves the app in a container; the library itself needs neither.
server = ["psycopg[binary]>=3.3.6", "uvicorn[standard]>=0.54.0"]

[tool.setuptools.package-data]
jatszoter_api = [
  "py.typed",
  "migrations/*.py",
  "migrations/*.mako",
  "migrations/versions/*.py",
  "schemas/*.yaml",
  "guest/*",
]
