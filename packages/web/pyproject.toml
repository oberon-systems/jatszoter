[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jatszoter-web"
version = "0.0.0"
description = "Operator and trainee UI for jatszoter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "cryptography",
  "fastapi",
  "httpx",
  "jinja2",
  "pydantic-settings",
  "python-multipart",
  "websockets",
]

[project.optional-dependencies]
# What serves the app in a container; the library itself needs neither.
server = ["uvicorn[standard]"]

[tool.setuptools.package-data]
jatszoter_web = ["py.typed", "templates/*.html", "static/*.css", "static/*.js", "static/vendor/*/*"]
